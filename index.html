<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#FFF4E0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bałaganek">
<title>Bałaganek – sprzątanie na wyścigi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF4E0;--ink:#3B2F4A;--soft:#8A7F96;--card:#fff;--acc:#FF7A45;--ok:#3CB371;--line:#F0E2CC}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Baloo 2",system-ui,sans-serif;overflow:hidden;user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow-y:auto;padding:16px 16px 24px}
.screen.on{display:flex}
h1{font-size:30px;margin:4px 0 0;line-height:1.1}
h2{font-size:20px;margin:18px 0 8px}
.sub{color:var(--soft);margin:2px 0 0;font-size:15px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stars{background:#fff;border-radius:999px;padding:4px 12px;font-weight:800;font-size:18px;box-shadow:0 2px 0 var(--line)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{background:var(--card);border-radius:16px;padding:8px 4px;text-align:center;box-shadow:0 3px 0 var(--line);border:3px solid transparent;transition:.15s}
.chip .e{font-size:32px;line-height:1.1;display:block}
.chip .n{font-size:14px;font-weight:700}
.chip.sel{border-color:var(--acc);background:#FFF0E8}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;box-shadow:0 3px 0 var(--line);border:3px solid transparent}
.pill.sel{border-color:var(--acc);background:#FFF0E8}
.timebox{display:flex;align-items:center;justify-content:center;gap:16px;background:#fff;border-radius:20px;padding:10px;box-shadow:0 3px 0 var(--line);margin-top:8px}
.timebox b{font-size:38px;min-width:120px;text-align:center}
.round{width:52px;height:52px;border-radius:50%;background:#FFE3D3;font-size:28px;font-weight:800}
.hint{background:#E9F7EF;border-radius:14px;padding:8px 12px;margin-top:8px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hint button{background:var(--ok);color:#fff;border-radius:999px;padding:4px 12px;font-weight:700}
.big{background:var(--acc);color:#fff;font-size:24px;font-weight:800;border-radius:22px;padding:14px;box-shadow:0 5px 0 #D85B2A;margin-top:18px;width:100%}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #D85B2A}
.big.green{background:var(--ok);box-shadow:0 5px 0 #2A8A55}
.link{color:var(--soft);text-decoration:underline;margin-top:10px;font-size:15px}
.album{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.album .st{width:62px;height:62px;background:#fff;border-radius:16px;box-shadow:0 3px 0 var(--line);display:flex;align-items:center;justify-content:center;position:relative}
.album .st.no{opacity:.35;filter:grayscale(1)}
.album .st i{position:absolute;right:-4px;top:-6px;background:var(--acc);color:#fff;font-style:normal;font-size:12px;font-weight:800;border-radius:999px;padding:0 6px}
.add{display:flex;gap:6px;margin-top:8px}
.add input{flex:1;font:inherit;font-size:16px;border:3px solid var(--line);border-radius:14px;padding:6px 10px;min-width:0}
.add button{background:#FFE3D3;border-radius:14px;padding:0 14px;font-weight:800}
.toggle{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:14px;padding:8px 12px;margin-top:8px;box-shadow:0 3px 0 var(--line)}
.sw{width:50px;height:28px;border-radius:999px;background:#ddd;position:relative;transition:.2s}
.sw::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s}
.sw.on{background:var(--ok)}.sw.on::after{left:25px}

/* GAME */
#game{padding:10px 12px 12px;overflow:hidden}
.bar{position:relative;height:34px;background:#fff;border-radius:999px;overflow:hidden;box-shadow:0 3px 0 var(--line);flex:none}
.bar .fill{position:absolute;inset:0;width:100%;background:#8BD3A0;transform-origin:left;transition:background .8s}
.bar .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-weight:800;font-size:19px}
.ctrl{display:flex;gap:8px;margin-top:8px;justify-content:space-between;flex:none}
.ctrl button{background:#fff;border-radius:999px;padding:4px 12px;font-weight:700;box-shadow:0 3px 0 var(--line)}
.stage{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:200px}
.bubble{pointer-events:none;position:absolute;top:2px;left:50%;transform:translateX(-50%);background:#fff;border-radius:18px;padding:6px 14px;font-weight:800;font-size:18px;text-align:center;max-width:92%;box-shadow:0 3px 0 var(--line);z-index:5;opacity:0;transition:opacity .25s}
.bubble.on{opacity:1}
.bubble::after{content:"";position:absolute;bottom:-9px;left:50%;margin-left:-9px;border:9px solid transparent;border-top-color:#fff;border-bottom:0}
.mwrap{position:relative;width:min(64vw,40vh,300px);aspect-ratio:1;transition:transform .7s cubic-bezier(.34,1.56,.64,1)}
.mbody{position:absolute;inset:0;animation:wob var(--wob,1.6s) ease-in-out infinite;transform-origin:50% 90%}
@keyframes wob{0%,100%{transform:rotate(-3deg) scaleY(1)}50%{transform:rotate(3deg) scaleY(.96)}}
.mbody svg{width:100%;height:100%;overflow:visible}
.toy{position:absolute;font-size:calc(min(64vw,40vh,300px)*.115);line-height:1;transform:translate(-50%,-50%) rotate(var(--r));transition:opacity .2s,transform .3s;filter:drop-shadow(0 2px 1px rgba(0,0,0,.15))}
.toy.gone{opacity:0;transform:translate(-50%,-50%) scale(.2)}
.bed{pointer-events:none;position:absolute;bottom:0;left:50%;transform:translateX(-50%) translateY(120%);font-size:min(36vw,150px);transition:transform .6s;z-index:3;line-height:1}
.bed.on{transform:translateX(-50%) translateY(10%)}
.zzz{position:absolute;right:8%;top:6%;font-size:28px;font-weight:800;color:#7B6BD6;opacity:0;z-index:4}
.zzz.on{animation:zz 2s ease-in-out infinite}
@keyframes zz{0%{opacity:0;transform:translate(0,10px)}40%{opacity:1}100%{opacity:0;transform:translate(16px,-30px)}}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:none}
.tiles.two{grid-template-columns:repeat(2,1fr)}
.tile{background:#fff;border-radius:18px;padding:6px 4px 8px;text-align:center;box-shadow:0 4px 0 var(--line);position:relative;transition:transform .1s}
.tile:active{transform:scale(.95)}
.tile .e{font-size:34px;line-height:1.15;display:block}
.tile .n{font-weight:800;font-size:15px}
.tile .ok{position:absolute;top:-6px;right:-4px;background:var(--ok);color:#fff;width:28px;height:28px;border-radius:50%;font-size:18px;display:none;align-items:center;justify-content:center;font-weight:800}
.tile.done{background:#E9F7EF;box-shadow:0 4px 0 #C5E8D2}
.tile.done .e{opacity:.45}
.tile.done .ok{display:flex}
.tile.pulse{animation:pl .5s}
@keyframes pl{50%{transform:scale(1.12)}}
.count{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:150px;font-weight:800;color:var(--acc);pointer-events:none;z-index:20;text-shadow:0 6px 0 #fff;opacity:0}
.count.go{animation:cnt .9s ease-out}
@keyframes cnt{0%{opacity:0;transform:scale(2)}20%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.8)}}
.flyer{position:fixed;z-index:30;pointer-events:none;line-height:1}
.tempo{font-size:22px}
.fast .bar{animation:shake .25s infinite}
@keyframes shake{0%,100%{transform:translateX(0)}50%{transform:translateX(2px)}}

/* overlay */
.ov{position:fixed;inset:0;background:rgba(59,47,74,.45);display:none;align-items:flex-end;justify-content:center;z-index:40}
.ov.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:18px 18px 22px;text-align:center;animation:up .35s}
@keyframes up{from{transform:translateY(100%)}}
.sheet h2{margin:4px 0 2px;font-size:26px}
.sheet .st{font-size:34px;letter-spacing:2px;margin:6px 0}
.confetti{position:fixed;top:-20px;font-size:24px;z-index:50;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.dots{display:flex;gap:14px;justify-content:center;margin:12px 0}
.dots i{width:18px;height:18px;border-radius:50%;border:3px solid var(--ink);display:block}
.dots i.f{background:var(--ink)}
.dots.bad{animation:shake .12s 4}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center}
.pad button{height:62px;border-radius:18px;background:#fff;font-size:28px;font-weight:800;box-shadow:0 3px 0 var(--line)}
.pad button:active{transform:translateY(2px)}
.rev{display:flex;flex-direction:column;gap:8px;margin:10px 0 4px;max-height:45vh;overflow-y:auto}
.rv{display:flex;justify-content:space-between;align-items:center;background:#E9F7EF;border-radius:14px;padding:10px 14px;font-weight:700;font-size:17px;border:3px solid transparent}
.rv.no{background:#FFE8E3;border-color:#FF7A45}
.rv b{font-size:14px}
.wrapmax{max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;flex:1}
</style>
</head>
<body>

<!-- HOME / SETUP (rodzic) -->
<section class="screen on" id="home"><div class="wrapmax">
  <div class="top">
    <div><h1>Bałaganek</h1><p class="sub">Sprzątanie na wyścigi z muzyką</p></div>
    <div class="stars" id="starsTop">⭐ 0</div>
  </div>
  <div id="heroMon" style="width:150px;height:150px;margin:6px auto 0"></div>

  <h2>1. Co jest do posprzątania?</h2>
  <div class="grid" id="cats"></div>
  <div class="add"><input id="newCat" maxlength="16" placeholder="Inna rzecz, np. „Klocki Lego”"><button id="addCat">+ Dodaj</button></div>

  <h2>2. Ile czasu dajesz?</h2>
  <div class="row" id="presets"></div>
  <div class="timebox"><button class="round" id="minus">−</button><b id="timeLbl">5:00</b><button class="round" id="plus">+</button></div>
  <div class="hint" id="hint" style="display:none"></div>

  <button class="big" id="start">Wypuść Bałaganka! 👾</button>
  <button class="big green" id="install" style="display:none;font-size:19px">📲 Zainstaluj na telefonie</button>

  <h2>Uśpione potworki</h2>
  <div class="album" id="album"></div>

  <div class="toggle"><span>🗣️ Bałaganek mówi na głos</span><div class="sw" id="voiceSw"></div></div>
  <div class="toggle"><span>🎵 Muzyka i dźwięki</span><div class="sw" id="soundSw"></div></div>
  <div class="toggle"><span>🔊 Głośność muzyki</span><input type="range" id="vol" min="20" max="100" step="5" style="width:45%;accent-color:#FF7A45"></div>
  <div class="toggle"><span>🔒 Rodzic zatwierdza PIN-em</span><div class="sw" id="pinSw"></div></div>
  <button class="pill" id="pinChange" style="margin-top:8px">Zmień PIN</button>
  <h2>Głos potworka</h2>
  <div class="row" id="vstyles"></div>
  <div class="row" id="vnames" style="margin-top:8px"></div>
  <button class="pill" id="vtest" style="margin-top:8px">▶ Posłuchaj</button>
  <p class="sub" style="margin-top:14px;font-size:13px;text-align:center">Wersja testowa v5 · dane zostają na tym telefonie</p>
</div></section>

<!-- GAME -->
<section class="screen" id="game"><div class="wrapmax">
  <div class="bar"><div class="fill" id="fill"></div><div class="lbl"><span class="tempo" id="tempo">🐢</span><span id="clock">5:00</span><span id="left">0/0</span></div></div>
  <div class="ctrl"><button id="pause">⏸ Pauza</button><button id="quit">✕ Zakończ</button></div>
  <div class="stage">
    <div class="bubble" id="bubble"></div>
    <div class="mwrap" id="mwrap"><div class="mbody" id="mbody"></div><div class="zzz" id="zzz">Z z z</div></div>
    <div class="bed" id="bed">🛏️</div>
  </div>
  <div class="tiles" id="tiles"></div>
</div></section>

<div class="count" id="count"></div>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<script>
// ---------- Dane ----------
const CATS=[
 {id:"klocki",n:"Klocki",e:["🧱","🟥","🟦"],m:"moje klocki"},
 {id:"autka",n:"Autka",e:["🚗","🚙","🚒"],m:"moje autka"},
 {id:"pluszaki",n:"Pluszaki",e:["🧸","🐻","🐰"],m:"moje pluszaki"},
 {id:"lalki",n:"Lalki",e:["🪆","👸","🧚"],m:"moje lalki"},
 {id:"ksiazki",n:"Książki",e:["📚","📕","📘"],m:"moje książki"},
 {id:"kredki",n:"Kredki",e:["🖍️","✏️","🖌️"],m:"moje kredki"},
 {id:"puzzle",n:"Puzzle",e:["🧩","🧩","🧩"],m:"moje puzzle"},
 {id:"pilki",n:"Piłki",e:["⚽","🏀","🎾"],m:"moje piłki"},
 {id:"ubrania",n:"Ubrania",e:["👕","🧦","👖"],m:"moje ubranka"},
 {id:"dinozaury",n:"Dinozaury",e:["🦖","🦕","🦖"],m:"moje dinozaury"},
 {id:"kuchnia",n:"Kuchenka",e:["🍳","🥄","🫖"],m:"moje garnuszki"},
 {id:"gry",n:"Gry",e:["🎲","🃏","🎮"],m:"moje gry"},
 {id:"pociagi",n:"Tory i pociągi",e:["🚂","🛤️","🚃"],m:"moje pociągi"}
];
const MONS=[
 {n:"Bałaganek",c:"#7BC74D"},{n:"Rozrzutek",c:"#9B6BE0"},{n:"Psotek",c:"#FF8A3D"},
 {n:"Kłębuś",c:"#3DA5FF"},{n:"Chaosik",c:"#FF5C9A"},{n:"Smyk",c:"#2EC4B6"}
];
const PRESETS=[[2,"Szybkie"],[3,"3 min"],[5,"5 min"],[8,"Pokój"],[10,"10 min"],[15,"Wielkie"]];

// ---------- Pamięć ----------
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let S=load("bk_set",{sel:["klocki","autka","pluszaki"],custom:[],min:5,voice:true,sound:true});
if(S.vol==null)S.vol=90;if(!S.vstyle)S.vstyle="potwor";
let G=load("bk_game",{stars:0,stickers:{},hist:{},wins:0});
const allCats=()=>CATS.concat(S.custom.map(n=>({id:"c_"+n,n:n,e:["📦","🎁","📦"],m:null})));
const $=id=>document.getElementById(id);

// ---------- Potwór (SVG) ----------
function monSVG(color,mood){
  const dark="rgba(0,0,0,.18)";
  let brows="",mouth="",eyes="";
  const E=(x)=>`<circle cx="${x}" cy="125" r="27" fill="#fff"/>`;
  if(mood==="sleep"){
    eyes=`<path d="M92 128 Q115 142 138 128" stroke="#3B2F4A" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M162 128 Q185 142 208 128" stroke="#3B2F4A" stroke-width="7" fill="none" stroke-linecap="round"/>`;
    mouth=`<ellipse cx="150" cy="192" rx="12" ry="9" fill="#3B2F4A"/>`;
  }else{
    const py=mood==="scared"?120:mood==="worried"?118:128, px=mood==="cocky"?6:0;
    eyes=E(115)+E(185)+`<circle cx="${115+px}" cy="${py}" r="12" fill="#3B2F4A"/><circle cx="${185+px}" cy="${py}" r="12" fill="#3B2F4A"/><circle cx="${119+px}" cy="${py-4}" r="4" fill="#fff"/><circle cx="${189+px}" cy="${py-4}" r="4" fill="#fff"/>`;
    if(mood==="cocky"){
      brows=`<path d="M86 88 L138 102" stroke="#3B2F4A" stroke-width="9" stroke-linecap="round"/><path d="M214 88 L162 102" stroke="#3B2F4A" stroke-width="9" stroke-linecap="round"/>`;
      mouth=`<path d="M100 172 Q150 228 200 172 Z" fill="#3B2F4A"/><path d="M118 176 L126 190 L134 178 Z M166 178 L174 190 L182 176 Z" fill="#fff"/>`;
    }else if(mood==="worried"){
      brows=`<path d="M90 100 L136 86" stroke="#3B2F4A" stroke-width="8" stroke-linecap="round"/><path d="M210 100 L164 86" stroke="#3B2F4A" stroke-width="8" stroke-linecap="round"/>`;
      mouth=`<path d="M112 196 Q131 182 150 196 Q169 210 188 196" stroke="#3B2F4A" stroke-width="8" fill="none" stroke-linecap="round"/>`;
    }else if(mood==="scared"){
      brows=`<path d="M92 92 L136 80" stroke="#3B2F4A" stroke-width="8" stroke-linecap="round"/><path d="M208 92 L164 80" stroke="#3B2F4A" stroke-width="8" stroke-linecap="round"/>`;
      mouth=`<ellipse cx="150" cy="196" rx="22" ry="20" fill="#3B2F4A"/>`;
    }else{ // happy
      mouth=`<path d="M112 180 Q150 215 188 180" stroke="#3B2F4A" stroke-width="8" fill="none" stroke-linecap="round"/>`;
    }
  }
  return `<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
   <ellipse cx="150" cy="284" rx="100" ry="12" fill="${dark}"/>
   <path d="M98 40 L88 6 L122 32 Z M202 40 L212 6 L178 32 Z" fill="${color}"/>
   <path d="M150 28 C218 28 266 76 270 142 C274 208 240 264 176 272 C124 278 62 266 40 208 C20 152 38 72 96 42 C113 32 131 28 150 28 Z" fill="${color}"/>
   <path d="M60 210 C70 250 120 268 176 262 C220 258 250 230 258 196 C250 250 210 272 170 274 C110 278 64 258 60 210Z" fill="${dark}"/>
   <ellipse cx="96" cy="272" rx="30" ry="14" fill="${color}"/><ellipse cx="204" cy="272" rx="30" ry="14" fill="${color}"/>
   ${eyes}${brows}${mouth}
   <circle cx="78" cy="170" r="12" fill="#fff" opacity=".18"/><circle cx="224" cy="170" r="12" fill="#fff" opacity=".18"/>
  </svg>`;
}
// miejsca na zabawki wokół potwora (poza twarzą), w układzie 300x300
const SLOTS=[[150,24],[106,36],[194,36],[62,66],[238,66],[36,116],[264,116],[30,166],[270,166],[44,214],[256,214],[82,250],[218,250],[150,262],[120,256],[180,256],[150,58],[74,110],[226,110],[60,150],[240,150],[72,196],[228,196],[150,232]];

// ---------- Dźwięk ----------
let AC=null,master=null,musBus=null,bus=null;
const musVol=()=>Math.pow((S.vol==null?90:S.vol)/100,1.5)*1.6;
function audio(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(AC.destination);master=AC.createGain();master.gain.value=1.3;master.connect(comp);musBus=AC.createGain();musBus.gain.value=musVol();musBus.connect(master)}catch(e){}} if(AC&&AC.state==="suspended")AC.resume(); return AC}
function tone(f,t,d,type="triangle",v=.25){ if(!AC||!S.sound)return; const o=AC.createOscillator(),g=AC.createGain(); o.type=type;o.frequency.value=f; g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d); o.connect(g);g.connect(bus||master);o.start(t);o.stop(t+d+.05)}
function noise(t,d,v=.12,hp=6000){ if(!AC||!S.sound)return; const b=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate),a=b.getChannelData(0); for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1; const s=AC.createBufferSource();s.buffer=b; const f=AC.createBiquadFilter();f.type="highpass";f.frequency.value=hp; const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d); s.connect(f);f.connect(g);g.connect(bus||master);s.start(t)}
function kick(t){ if(!AC||!S.sound)return; const o=AC.createOscillator(),g=AC.createGain(); o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.15); g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.2); o.connect(g);g.connect(bus||master);o.start(t);o.stop(t+.25)}
const mid=n=>440*Math.pow(2,(n-69)/12);
function sfxPop(){audio();const t=AC?AC.currentTime:0;[72,76,79,84].forEach((n,i)=>tone(mid(n),t+i*.07,.18,"square",.12))}
function sfxUndo(){audio();const t=AC?AC.currentTime:0;[79,72].forEach((n,i)=>tone(mid(n),t+i*.1,.15,"triangle",.15))}
function sfxFanfare(){audio();if(!AC)return;const t=AC.currentTime+.05;[60,64,67,72,67,72].forEach((n,i)=>tone(mid(n),t+i*.13,.25,"square",.13));[60,64,67,72].forEach(n=>tone(mid(n),t+.85,1.2,"triangle",.14));noise(t+.85,.6,.08,3000)}
function sfxLose(){audio();if(!AC)return;const t=AC.currentTime+.05;[67,66,65,62].forEach((n,i)=>tone(mid(n),t+i*.32,i==3?.8:.3,"sawtooth",.08))}

// Muzyka przyspieszająca: tempo i warstwy zależą od upływu czasu
const MEL=[0,4,7,4, 9,7,4,2, 0,4,7,9, 12,9,7,4, 5,9,12,9, 7,4,2,4, 0,2,4,7, 4,2,0,-1];
const BASS=[0,0,7,7, 5,5,7,7];
let mus={on:false,step:0,next:0,timer:null};
function phaseOf(f){return f<.4?0:f<.7?1:f<.9?2:3}
function bpmOf(f){ if(f<.4)return 92+f/.4*12; if(f<.7)return 110+(f-.4)/.3*14; if(f<.9)return 130+(f-.7)/.2*14; return 158+(f-.9)/.1*10 }
function musStart(){ audio(); if(!AC)return; mus.on=true; mus.step=0; mus.next=AC.currentTime+.08; clearInterval(mus.timer); mus.timer=setInterval(musTick,25) }
function musStop(){ mus.on=false; clearInterval(mus.timer) }
function musTick(){
  if(!mus.on||!AC)return;
  const f=game.frac(), ph=phaseOf(f), tr=[0,2,3,5][ph];
  bus=musBus;
  while(mus.next<AC.currentTime+.12){
    const t=mus.next, s=mus.step, sec=60/bpmOf(f)/2; // ósemki
    const root=48+tr;
    if(s%2===0) tone(mid(root+BASS[(s>>1)%8]),t,sec*1.6,"triangle",.28);
    const m=MEL[s%32]; if(ph>0||s%2===0) tone(mid(72+tr+m),t,sec*.9,ph>=2?"square":"triangle",ph>=2?.08:.12);
    if(ph>=1&&s%2===1) noise(t,.05,.07);
    if(ph>=2&&s%2===0) kick(t);
    if(ph>=3){ noise(t,.03,.1,9000); if(s%4===2) tone(mid(84+tr+m),t,sec*.5,"square",.05) }
    mus.next+=sec; mus.step++;
  }
  bus=null;
}

const VSTYLES={

function plVoices(){try{return speechSynthesis.getVoices().filter(x=>/^pl/i.test(x.lang))}catch(e){return[]}}
function growl(kind){
  audio(); if(!AC||!S.sound||!kind)return; const t=AC.currentTime;
  if(kind==="growl"){ // niskie warczenie „grrr”
    const o=AC.createOscillator(),lf=AC.createOscillator(),lg=AC.createGain(),f=AC.createBiquadFilter(),g=AC.createGain();
    o.type="sawtooth";o.frequency.setValueAtTime(95,t);o.frequency.linearRampToValueAtTime(65,t+.45);
    lf.frequency.value=28;lg.gain.value=.5;lf.connect(lg);lg.connect(g.gain);
    f.type="lowpass";f.frequency.value=700;g.gain.setValueAtTime(.5,t);g.gain.linearRampToValueAtTime(0,t+.5);
    o.connect(f);f.connect(g);g.connect(master);o.start(t);lf.start(t);o.stop(t+.55);lf.stop(t+.55);
  }else if(kind==="chirp"){[0,.09,.18].forEach((d,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type="sine";o.frequency.setValueAtTime(1200+i*300,t+d);o.frequency.exponentialRampToValueAtTime(2200+i*300,t+d+.07);g.gain.setValueAtTime(.2,t+d);g.gain.exponentialRampToValueAtTime(.001,t+d+.08);o.connect(g);g.connect(master);o.start(t+d);o.stop(t+d+.1)})}
  else if(kind==="robot"){[0,.1,.2].forEach((d,i)=>tone([440,660,330][i],t+d,.08,"square",.15))}
}

const game={

function loop(){
  cancelAnimationFrame(game.raf);
  const step=()=>{
    if(game.over)return;
    if(!game.paused){
      const el=game.elapsed(), rem=game.total-el, f=game.frac(), ph=phaseOf(f);
      $("clock").textContent=fmt(rem);
      $("fill").style.transform=`scaleX(${1-f})`;
      $("fill").style.background=["#8BD3A0","#FFD166","#FF9F5A","#FF5C5C"][ph];
      $("tempo").textContent=["🐢","🐇","🐆","🚀"][ph];
      $("mbody").style.setProperty("--wob",[1.6,1.1,.7,.4][ph]+"s");
      document.body.classList.toggle("fast",ph===3);
      if(ph>game.lastPhase){game.lastPhase=ph;say(["","Ooo, muzyka przyspiesza!","Szybciej, szybciej! Hi hi!","Ostatnie sekundy! Nie zdążycie!"][ph])}
      const s=Math.ceil(rem); if(s<=10&&s>=1&&s<game.lastSec){game.lastSec=s;flash(s);beep(s<=3)}
      if(performance.now()>game.tauntAt&&ph<3){game.tauntAt=performance.now()+22000+Math.random()*10000;if(!$("bubble").classList.contains("on"))say(fresh(TAUNTS))}
      if(rem<=0){lose();return}
    }
    game.raf=requestAnimationFrame(step);
  };
  game.raf=requestAnimationFrame(step);
}

  setMood("scared"); say(fresh(["Nieee... jestem taki malutki... chyba się zdrzemnę...","Wygraliście... Ziew... idę spać do pudełka...","No dobra, dobra... posprzątane. Dobranoc!"]),3000);
  setTimeout(()=>{setMood("sleep");$("zzz").classList.add("on");sfxFanfare()},1400);
  setTimeout(callParent,2700);
}
function callParent(){
  sheet(`<h2>Wszystko odhaczone! 🎉</h2><p class="sub">Czas stanął na <b>${fmt(game.usedAt)}</b> z ${fmt(game.total)}. ${game.mon.n} śpi w pudełku.</p>
    <div style="font-size:64px;line-height:1.2">🧑‍🦰👀</div><p style="font-weight:800;font-size:21px;margin:2px 0">Zawołajcie rodzica,<br>niech sprawdzi pokój!</p>
    <button class="big green" id="c1">Jestem rodzicem – sprawdzam</button>`);
  $("c1").onclick=review;
}
function review(){
  const bad=new Set();
  const draw=()=>{
    sheet(`<h2>Sprawdź pokój 👀</h2><p class="sub">Stuknij to, co jeszcze nie jest posprzątane</p>
      <div class="rev" id="rev">${game.cats.map(c=>`<button class="rv ${bad.has(c.id)?"no":""}" data-id="${c.id}"><span>${c.e[0]} ${c.n}</span><b>${bad.has(c.id)?"❌ jeszcze leży":"✅ gotowe"}</b></button>`).join("")}</div>
      ${bad.size?`<button class="big" id="r2">Wracamy do sprzątania (${bad.size})</button>`:`<button class="big green" id="r1">Zatwierdzam – dajemy nagrodę</button>`}`);
    $("rev").onclick=e=>{const b=e.target.closest("[data-id]");if(!b)return;const id=b.dataset.id;bad.has(id)?bad.delete(id):bad.add(id);draw()};
    if($("r1"))$("r1").onclick=()=>checkPin("Zatwierdź nagrodę",approve,draw);
    if($("r2"))$("r2").onclick=()=>checkPin("Wracamy do sprzątania",()=>backToWork(bad),draw);
  };
  draw();
}
function approve(){
  const used=game.usedAt; end(); confetti(); sfxFanfare();
  const saved=Math.floor((game.total-used)/60), bonus=Math.min(5,Math.max(0,saved)), stars=3+bonus;
  G.stars+=stars;G.stickers[game.mon.n]=(G.stickers[game.mon.n]||0)+1;G.wins++;G.hist[keyOf()]=Math.round(used);save("bk_game",G);
  sheet(`<h2>Bałagan pokonany! 🎉</h2><p class="sub">Rodzic sprawdził i zatwierdził. ${game.mon.n} trafia do albumu!</p>
    <div style="width:110px;height:110px;margin:4px auto">${monSVG(game.mon.c,"sleep")}</div>
    <div class="st">${"⭐".repeat(stars)}</div><p class="sub">${bonus?`3 gwiazdki + ${bonus} za ${bonus===1?"zaoszczędzoną minutę":"zaoszczędzone minuty"}`:"3 gwiazdki za posprzątanie"}</p>
    <button class="big green" id="a1">Super!</button>`);
  $("a1").onclick=()=>{closeSheet();show("home");renderHome()};
}
function backToWork(bad){
  closeSheet(); game.awaiting=false; $("zzz").classList.remove("on");
  bad.forEach(id=>{game.done.delete(id);$("mwrap").querySelectorAll(`.toy[data-cat="${CSS.escape(id)}"]`).forEach(el=>el.classList.remove("gone"))});
  renderTiles(); scaleMon(); setMood("cocky"); sfxUndo();
  say(fresh(["Ha! Rodzic znalazł bałagan! Rosnę!","Hi hi! Nie wszystko posprzątane! Wracam!","Jupi! Jeszcze tu jestem!"]),2800);
  game.pausedSum+=performance.now()-game.pauseAt; game.paused=false; musStart();
}
function lose(){
  end(); $("clock").textContent="0:00"; setMood("cocky"); say(fresh(["Ha! Uciekam pod łóżko! Wrócę jutro!","Hi hi! Nie zdążyliście! Chowam się pod łóżko!","Do zobaczenia jutro! Będę czekał pod łóżkiem!"]),3000); sfxLose();
  $("bed").classList.add("on"); setTimeout(()=>{$("mwrap").style.transform+=" translateY(45%)"},700);
  const d=game.done.size, stars=d?1:0;
  setTimeout(()=>{
    sheet(`<h2>${game.mon.n} uciekł pod łóżko!</h2><p class="sub">Posprzątane: <b>${d} z ${game.cats.length}</b>. Następnym razem się uda!</p>
      <div class="st">${stars?"⭐":"💪"}</div><p class="sub">${stars?"1 gwiazdka za dobrą próbę":"Spróbujcie jeszcze raz"}</p>
      <button class="big" id="l1">Jeszcze raz! (+1 minuta)</button><button class="link" id="l2">Wróć do menu</button>`);
    const fin=()=>{G.stars+=stars;save("bk_game",G)};
    $("l1").onclick=()=>{fin();closeSheet();S.min=Math.min(30,S.min+1);save("bk_set",S);startGame()};
    $("l2").onclick=()=>{fin();closeSheet();show("home");renderHome()};
  },2600);
}
function confetti(){for(let i=0;i<30;i++){const c=document.createElement("span");c.className="confetti";c.textContent=pick(["🎉","⭐","✨","🎊","💫"]);c.style.left=Math.random()*100+"vw";c.style.animationDuration=(1.8+Math.random()*1.8)+"s";c.style.animationDelay=Math.random()*.6+"s";document.body.appendChild(c);setTimeout(()=>c.remove(),4500)}}
// ---------- PIN rodzica ----------
function pinPad(o){
  let v=""; const len=o.len||4;
  sheet(`<h2>${o.title}</h2><p class="sub">${o.sub||""}</p><div class="dots" id="dots"></div>
    <div class="pad" id="pad">${["1","2","3","4","5","6","7","8","9","x","0","⌫"].map(k=>`<button data-k="${k}" ${k==="x"?"style='visibility:hidden'":""}>${k}</button>`).join("")}</div>
    <p class="sub" id="pinErr" style="color:#D9502F;min-height:24px;font-weight:700"></p>
    ${o.forgot?`<button class="link" id="pinF">Nie pamiętam PIN-u</button><br>`:""}${o.cancel?`<button class="link" id="pinX">Anuluj</button>`:""}`);
  const draw=()=>{$("dots").innerHTML=Array.from({length:len},(_,i)=>`<i class="${i<v.length?"f":""}"></i>`).join("")}; draw();
  $("pad").onclick=e=>{const b=e.target.closest("[data-k]");if(!b)return;const k=b.dataset.k;if(k==="x")return;
    if(k==="⌫")v=v.slice(0,-1);else if(v.length<len)v+=k;draw();
    if(v.length===len){ if(o.check(v)){o.ok(v)} else {$("pinErr").textContent=o.err||"Zły PIN, spróbuj jeszcze raz";$("dots").classList.add("bad");setTimeout(()=>{v="";draw();$("dots").classList.remove("bad")},450)} }};
  if(o.cancel)$("pinX").onclick=o.cancel;
  if(o.forgot)$("pinF").onclick=o.forgot;
}
function checkPin(title,ok,cancel){
  if(!S.pinOn||!S.pin){ok();return}
  pinPad({title,sub:"Wpisz PIN rodzica",check:v=>v===S.pin,ok:()=>ok(),cancel,forgot:()=>adultGate(()=>setNewPin(ok,cancel),cancel)});
}
function adultGate(ok,cancel){
  const a=6+Math.floor(Math.random()*4),b=6+Math.floor(Math.random()*4);
  pinPad({title:`Ile to ${a} × ${b}?`,sub:"Pytanie dla dorosłych – potem ustawisz nowy PIN",len:2,err:"Niestety źle",check:v=>+v===a*b,ok:()=>ok(),cancel});
}
function setNewPin(ok,cancel){
  pinPad({title:"Ustaw PIN rodzica",sub:"4 cyfry, których dzieci nie znają",check:()=>true,cancel,ok:first=>{
    pinPad({title:"Powtórz PIN",sub:"Wpisz te same 4 cyfry",err:"PIN-y się różnią, spróbuj jeszcze raz",check:v=>v===first,cancel,ok:v=>{S.pin=v;S.pinOn=true;save("bk_set",S);renderHome();ok()}});
  }});
}
function firstPinThen(next){
  if(S.pin||S.pinOn===false){next();return}
  sheet(`<h2>🔒 PIN rodzica</h2><p class="sub" style="font-size:16px">Gdy dzieci odhaczą wszystko, czas się zatrzyma, a one muszą zawołać rodzica. Rodzic sprawdza pokój i zatwierdza nagrodę PIN-em, żeby dzieci nie zrobiły tego same.</p>
    <button class="big green" id="p1">Ustaw PIN</button><button class="link" id="p2">Bez PIN-u (zatwierdzanie przyciskiem)</button>`);
  $("p1").onclick=()=>setNewPin(()=>{closeSheet();next()},()=>firstPinThen(next));
  $("p2").onclick=()=>{S.pinOn=false;save("bk_set",S);closeSheet();renderHome();next()};
}
function sheet(h){$("sheet").innerHTML=h;$("ov").classList.add("on")}
function closeSheet(){$("ov").classList.remove("on")}
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id))}
async function wakeOn(){try{game.wake=await navigator.wakeLock.request("screen")}catch(e){}}
function wakeOff(){try{game.wake&&game.wake.release();game.wake=null}catch(e){}}
$("start").onclick=()=>{if(S.sel.length)firstPinThen(startGame)};
$("pinSw").onclick=()=>{ if(S.pinOn&&S.pin){checkPin("Wyłączyć PIN?",()=>{S.pinOn=false;save("bk_set",S);closeSheet();renderHome()},closeSheet)} else if(S.pin){S.pinOn=true;save("bk_set",S);renderHome()} else setNewPin(closeSheet,closeSheet) };
$("pinChange").onclick=()=>checkPin("Zmiana PIN-u",()=>setNewPin(closeSheet,closeSheet),closeSheet);
window.appBack=function(){ if($("ov").classList.contains("on")){return} if($("game").classList.contains("on")){$("quit").click();return} try{Android.exit()}catch(e){} };
document.addEventListener("visibilitychange",()=>{ if(document.hidden&&$("game").classList.contains("on")&&!game.over&&!game.paused&&game.startT!==Infinity)$("pause").click() });
// przycisk instalacji (Chrome na Androidzie)
let instEv=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();instEv=e;$("install").style.display="block"});
window.addEventListener("appinstalled",()=>{instEv=null;$("install").style.display="none"});
$("install").onclick=async()=>{if(!instEv)return;try{instEv.prompt();await instEv.userChoice}catch(e){}instEv=null;$("install").style.display="none"};
renderHome();
// automatyczne aktualizacje (działa na GitHub Pages)
if("serviceWorker" in navigator&&location.protocol==="https:"&&/github\.io$/.test(location.hostname)){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
</body>
